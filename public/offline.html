
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <title>Çevrimdışısın | BAY PATRON</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #08090b;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 36px 24px;
        border: 1px solid #514214;
        border-radius: 24px;
        background: #111214;
      }
      .crown { color: #facc15; font-size: 64px; }
      h1 { color: #facc15; letter-spacing: 4px; }
      p { color: #a1a1aa; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 22px;
        border-radius: 12px;
        background: #facc15;
        color: #08090b;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="crown">♛</div>
      <h1>BAY PATRON</h1>
      <p>Şu anda internet bağlantın yok.</p>
      <p>Daha önce kaydettiğin müzikler bu cihazda duruyor olabilir. Yeni müzikleri aramak için yeniden bağlanmalısın.</p>
      <a href="/">Tekrar Dene</a>
    </main>
  </body>
</html>
